; ─────────────────────────────────────────────────────────────────────────────
;  PHP limits for Take Care Connect Admin
;
;  Copy this into the document root as `.user.ini` (note the leading dot):
;
;      cp deploy/user.ini public/.user.ini
;
;  Hostinger reads .user.ini per-directory on PHP-FPM. If it has no effect,
;  set the same four values in hPanel → Advanced → PHP Configuration, which
;  writes them at the account level instead.
;
;  Changes can take a few minutes to apply — PHP caches .user.ini for the
;  duration of user_ini.cache_ttl (300 seconds by default).
; ─────────────────────────────────────────────────────────────────────────────

; The largest thing this application accepts is a 200 MB video cut.
;
; post_max_size must exceed upload_max_filesize, because the POST carries the
; form fields as well as the file. When a request exceeds post_max_size PHP
; discards the whole body before the application sees it, so an over-large
; upload arrives as an empty form rather than an error — which is why these two
; being right matters more than it looks.
upload_max_filesize = 210M
post_max_size = 220M

; Uploading 200 MB over a domestic connection is minutes. The stock 30 seconds
; kills the request partway and leaves a truncated file on disk.
max_execution_time = 300
max_input_time = 300

; Laravel streams uploads to a temporary file rather than holding them in
; memory, so this does not need to match the upload size. 256M covers the
; article exporter building a ZIP.
memory_limit = 256M

; One interview handover can carry a document, a recording and a dozen photos.
max_file_uploads = 30
